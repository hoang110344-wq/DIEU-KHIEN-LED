<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều Khiển LED Từ Xa</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; margin: 10px; width: 120px; }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }
        #status { margin-top: 20px; font-size: 16px; color: #555; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>💡 Bảng Điều Khiển LED</h2>
        <div>
            <button class="btn-on" onclick="setLed(1)">BẬT</button>
            <button class="btn-off" onclick="setLed(0)">TẮT</button>
        </div>
        <div id="status">Đang kết nối hệ thống...</div>
    </div>

    <script>
        const FIREBASE_URL = "https://huhu-b8feb-default-rtdb.asia-southeast1.firebasedatabase.app/Led.json?auth=UUXzA3vlvd6TCvL06HK3l32XxQoMJMp1T5piRjQ8";

        async function setLed(state) {
            document.getElementById("status").innerText = "Đang gửi lệnh...";
            try {
                await fetch(FIREBASE_URL, { method: 'PUT', body: JSON.stringify(state) });
                document.getElementById("status").innerText = state === 1 ? "Trạng thái: ĐANG BẬT 🟢" : "Trạng thái: ĐANG TẮT 🔴";
            } catch (e) {
                document.getElementById("status").innerText = "Lỗi mạng!";
            }
        }

        async function getLed() {
            try {
                let res = await fetch(FIREBASE_URL);
                let state = await res.json();
                document.getElementById("status").innerText = state === 1 ? "Trạng thái: ĐANG BẬT 🟢" : "Trạng thái: ĐANG TẮT 🔴";
            } catch (e) {}
        }
        
        getLed();
        setInterval(getLed, 2000);
    </script>
</body>
</html>
